<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Drawing – Lord Hanuman</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;background:#000;color:#fff;font-family:Georgia,"Times New Roman",serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.rule{display:flex;align-items:center;justify-content:center;gap:16px;width:min(70vw,420px)}
.rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#aaa)}
.rule i:last-child{background:linear-gradient(270deg,transparent,#aaa)}
.om{font-size:32px;line-height:1}
h1{margin:6px 0 2px;font-weight:400;font-size:clamp(22px,3.4vw,38px);letter-spacing:.5px}
.sub{color:#999;font-size:12px;letter-spacing:4px;margin-bottom:12px}
.frame{flex:1;min-height:0;width:min(98%,1180px);border:1px solid #444;border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000}
.paper{position:relative}
canvas{display:block;width:100%;height:100%}
#pencil{position:absolute;left:0;top:0;pointer-events:none;transform-origin:0 0;transition:opacity .6s;will-change:transform}
.foot{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;margin-top:10px;font-size:15px;letter-spacing:3px;color:#ddd}
.foot .rule{width:190px;margin-top:2px}
.btns{position:absolute;right:max(0px,calc(50% - 590px));top:2px;display:flex;gap:8px}
button{background:#000;color:#fff;border:1px solid #777;border-radius:22px;padding:9px 20px;font:14px Georgia,serif;cursor:pointer}
button:hover{background:#fff;color:#000}
@media(max-width:700px){.btns{position:static;margin-bottom:8px}.foot{font-size:13px;margin-top:8px}.sub{font-size:10px;letter-spacing:3px;margin-bottom:8px}.om{font-size:26px}button{padding:8px 16px;font-size:13px}.frame{width:100%}}
</style>
</head>
<body>
<div class="rule"><i></i><span class="om">ॐ</span><i></i></div>
<h1>Live Drawing – Lord Hanuman</h1>
<div class="sub">Watch the divine form come to life...</div>

<div class="frame" id="frame">
  <div class="paper" id="paper">
    <canvas id="c"></canvas>
    <svg id="pencil" width="380" height="40" viewBox="0 0 380 40">
      <defs>
        <radialGradient id="g"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#555"/><stop offset=".5" stop-color="#222"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient>
      </defs>
      <polygon points="0,20 60,9 60,31" fill="#d9bf98"/>
      <polygon points="0,20 14,17.5 14,22.5" fill="#222"/>
      <rect x="60" y="8" width="320" height="24" rx="3" fill="url(#b)"/>
      <rect x="60" y="11" width="320" height="2" fill="#777" opacity=".5"/>
      <circle id="glow" cx="0" cy="20" r="14" fill="url(#g)"/>
    </svg>
  </div>
</div>

<div class="foot">
  <div class="btns">
    <button id="speedBtn">Speed: Slow</button>
    <button id="again">↻ Draw Again</button>
  </div>
  <div>|| Jai Shree Ram ||</div>
  <div class="rule"><i></i><span class="om" style="font-size:20px">ॐ</span><i></i></div>
</div>

<script src="sketch.js"></script>
<script>

const DURATIONS=[40,20,8], LABELS=["Slow","Normal","Fast"];
let speed=0;

const canvas=document.getElementById("c"), ctx=canvas.getContext("2d",{willReadFrequently:true});
const paper=document.getElementById("paper"), frame=document.getElementById("frame");
const pencil=document.getElementById("pencil");
const img=new Image();
let W,H,gray,out,outData,path,t0=null,drawnTo=0,raf,scale=1,finished=false;

img.onload=()=>{
  W=canvas.width=img.naturalWidth; H=canvas.height=img.naturalHeight;
  ctx.drawImage(img,0,0);
  const d=ctx.getImageData(0,0,W,H).data;
  gray=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++) gray[i]=d[i*4];
  buildPath(); fit(); start();
};
img.src=SRC;

/* ---- build one continuous "pencil walk" over the bright lines ---- */
function buildPath(){
  const INK=70, vis=new Uint8Array(W*H), pts=[];
  const ink=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&gray[y*W+x]>INK&&!vis[y*W+x];
  let scan=0;
  function nextScan(){ while(scan<W*H&&!(gray[scan]>INK&&!vis[scan])) scan++; return scan<W*H?scan:-1; }
  function nearest(x,y,R){
    for(let r=3;r<=R;r++){
      let best=null,bd=1e9;
      for(let dx=-r;dx<=r;dx++) for(const dy of (Math.abs(dx)===r?null:[-r,r])||range(-r,r)){
        const nx=x+dx,ny=y+dy;
        if(ink(nx,ny)){const dd=dx*dx+dy*dy; if(dd<bd){bd=dd;best=[nx,ny];}}
      }
      if(best) return best;
    }
    return null;
  }
  function range(a,b){const r=[];for(let i=a;i<=b;i++)r.push(i);return r;}
  function mark(x,y){
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const nx=x+dx,ny=y+dy; if(nx>=0&&ny>=0&&nx<W&&ny<H) vis[ny*W+nx]=1;
    }
  }
  let s=nextScan(); if(s<0) return;
  let x=s%W,y=(s/W)|0,lx=0,ly=1;
  for(;;){
    mark(x,y); pts.push(x,y);
    let best=null,bs=1e9;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      if(!dx&&!dy) continue;
      if(!ink(x+dx,y+dy)) continue;
      const dist=Math.hypot(dx,dy);
      const cos=(dx*lx+dy*ly)/dist/Math.hypot(lx,ly);
      const sc=dist-cos*0.8;
      if(sc<bs){bs=sc;best=[x+dx,y+dy];}
    }
    if(!best) best=nearest(x,y,70);
    if(!best){ const k=nextScan(); if(k<0) break; best=[k%W,(k/W)|0]; }
    lx=best[0]-x||lx; ly=best[1]-y||ly;
    if(Math.hypot(best[0]-x,best[1]-y)>4){lx=0;ly=1;}
    x=best[0]; y=best[1];
  }
  path=pts;
}

/* ---- layout ---- */
function fit(){
  if(!W) return;
  const fw=frame.clientWidth-20, fh=frame.clientHeight-20;
  scale=Math.min(fw/W,fh/H);
  paper.style.width=W*scale+"px"; paper.style.height=H*scale+"px";
  pencil.style.width=pencil.style.height="";
}
addEventListener("resize",()=>{fit();placePencil(lastX,lastY);});

/* ---- animation ---- */
let lastX=0,lastY=0;
function placePencil(x,y){
  const k=scale*0.85;
  pencil.style.transform=`translate(${x*scale}px,${y*scale}px) rotate(-26deg) translate(0,-20px) scale(${k})`;
}
function reveal(x,y){
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=W||ny>=H) continue;
    const i=ny*W+nx, v=gray[i], o=i*4;
    outData.data[o]=outData.data[o+1]=outData.data[o+2]=v; outData.data[o+3]=255;
  }
}
function start(){
  cancelAnimationFrame(raf);
  finished=false; drawnTo=0; t0=null;
  outData=ctx.createImageData(W,H);
  for(let i=3;i<outData.data.length;i+=4) outData.data[i]=255;
  ctx.putImageData(outData,0,0);
  pencil.style.opacity=1;
  raf=requestAnimationFrame(tick);
}
function tick(t){
  if(t0===null) t0=t;
  const total=path.length/2;
  const n=Math.min(total,Math.floor((t-t0)/1000/DURATIONS[speed]*total));
  for(let i=drawnTo;i<n;i++) reveal(path[i*2],path[i*2+1]);
  if(n>drawnTo){
    drawnTo=n; ctx.putImageData(outData,0,0);
    lastX=path[(n-1)*2]; lastY=path[(n-1)*2+1]; placePencil(lastX,lastY);
  }
  if(n<total){ raf=requestAnimationFrame(tick); }
  else finish();
}
function finish(){
  /* fade in the full-fidelity sketch (fills soft shading), then lift the pencil */
  const bmp=document.createElement("canvas"); bmp.width=W; bmp.height=H;
  const bctx=bmp.getContext("2d"); bctx.drawImage(img,0,0);
  const base=document.createElement("canvas"); base.width=W; base.height=H;
  base.getContext("2d").putImageData(outData,0,0);
  const s=performance.now();
  pencil.style.opacity=0;
  (function f(now){
    const a=Math.min(1,(now-s)/1200);
    ctx.globalAlpha=1; ctx.drawImage(base,0,0);
    ctx.globalAlpha=a; ctx.drawImage(bmp,0,0); ctx.globalAlpha=1;
    if(a<1&&!finished) raf=requestAnimationFrame(f);
  })(s);
}
document.getElementById("again").onclick=()=>{finished=true;start();};
document.getElementById("speedBtn").onclick=function(){
  speed=(speed+1)%3; this.textContent="Speed: "+LABELS[speed];
  if(path&&t0!==null&&!finished){ t0=performance.now()-(drawnTo/(path.length/2))*DURATIONS[speed]*1000; }
};
</script>
</body>
</html>
